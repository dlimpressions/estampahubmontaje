<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EstampaHub DTF - Editor Móvil</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0c15;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header minimalista */
    .header {
      padding: 12px 16px;
      background: rgba(10, 12, 21, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .logo span { color: #0ea5e9; }
    .header-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 30px;
      padding: 6px 12px;
      color: white;
      font-size: 0.7rem;
      font-weight: 500;
    }

    /* Área del canvas (ocupa todo el espacio disponible) */
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #06080f;
      position: relative;
    }
    .canvas-wrapper {
      background: #1e1f2c;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      overflow: auto;
      max-width: 95%;
      max-height: 95%;
    }
    canvas {
      display: block;
      background: white;
      box-shadow: 0 0 0 1px rgba(14,165,233,0.3);
      cursor: crosshair;
      touch-action: none;
    }

    /* Barra inferior de herramientas (estilo PhotoRoom) */
    .toolbar-bottom {
      background: rgba(10, 12, 21, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .tool-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 40px;
      padding: 10px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.1s;
      min-width: 70px;
      justify-content: center;
    }
    .tool-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.96); }
    .tool-btn.primary { background: #0ea5e9; color: white; box-shadow: 0 2px 8px rgba(14,165,233,0.3); }
    .tool-btn.danger { background: #f43f5e; }
    .tool-btn.warning { background: #f59e0b; }

    /* Barra de estado inferior */
    .status {
      background: #0f111a;
      padding: 6px 16px;
      font-size: 0.6rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      flex-shrink: 0;
    }

    /* Modales */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-card {
      background: #11131f;
      border-radius: 28px;
      padding: 20px;
      width: 90%;
      max-width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid rgba(14,165,233,0.2);
    }
    .modal-card h2 { font-size: 1.3rem; margin-bottom: 1rem; color: white; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 40px;
      border: 1px solid #2a2e40;
      background: #1a1c2a;
      color: white;
      font-size: 1rem;
    }
    button { cursor: pointer; }

    /* Galería interna simplificada */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    .gallery-item {
      background: #1e2030;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1/1;
      cursor: pointer;
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Ocultar elementos originales que no usamos */
    .adobe-toolbar, .toolbar, .controls, .instructions, .floating-tools, #tb-designs-dropdown, .designs-dropdown {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">DTF <span>Express</span></div>
  <button class="header-btn" id="profile-mobile">👤 Mi cuenta</button>
</div>

<div class="canvas-container" id="canvas-container">
  <div class="canvas-wrapper" id="canvas-wrapper-mobile">
    <canvas id="canvas" width="580" height="1000"></canvas>
  </div>
</div>

<div class="toolbar-bottom">
  <button class="tool-btn" id="mobile-upload">📷 Subir</button>
  <button class="tool-btn" id="mobile-gallery">🖼️ Galería</button>
  <button class="tool-btn primary" id="mobile-save">💾 Guardar</button>
  <button class="tool-btn" id="mobile-export">📤 Exportar</button>
  <button class="tool-btn warning" id="mobile-crop">✂️ Recortar</button>
  <button class="tool-btn danger" id="mobile-clear">🗑️ Limpiar</button>
</div>

<div class="toolbar-bottom" style="border-top: none; padding-top: 0; gap: 12px;">
  <button class="tool-btn" id="zoom-out">🔍 -</button>
  <span style="color:#94a3b8; font-size:0.7rem;">Zoom</span>
  <button class="tool-btn" id="zoom-in">🔍 +</button>
  <button class="tool-btn" id="mobile-mirror">🪞 Espejo</button>
  <button class="tool-btn" id="mobile-text">✏️ Texto</button>
</div>

<div class="status">
  <span>📁 <span id="mobile-design-count">0</span> diseños</span>
  <span>📐 <span id="mobile-canvas-size">58x100 cm</span></span>
  <span>🔍 <span id="mobile-zoom">100</span>%</span>
</div>

<!-- MODALES (mismos IDs que el index para compatibilidad) -->
<div id="imgbb-gallery-overlay" class="modal" style="display:none;">
  <div class="modal-card">
    <h2>📁 Mis diseños</h2>
    <div id="searchContainer"></div>
    <div id="imgbb-designs-grid" class="gallery-grid"></div>
    <div id="pagination" style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;"></div>
    <button class="tool-btn" id="close-imgbb-gallery" style="margin-top:12px;">Cerrar</button>
  </div>
</div>

<div id="dtf-overlay" class="modal" style="display:none;">
  <div class="modal-card">
    <h2>📤 Enviar pedido DTF</h2>
    <form id="dtfForm">
      <input type="text" id="dtf-name" placeholder="Nombre" required>
      <input type="email" id="dtf-email" placeholder="Correo" required>
      <input type="tel" id="dtf-phone" placeholder="Teléfono" required>
      <input type="text" id="dtf-city" placeholder="Ciudad" required>
      <textarea id="dtf-message" placeholder="Mensaje" rows="2"></textarea>
      <input type="file" id="dtf-file" accept=".png,.jpg,.jpeg,.pdf,.zip" required>
      <button type="submit" class="tool-btn primary" style="width:100%;">Enviar</button>
      <button type="button" class="tool-btn" id="dtf-close" style="width:100%; margin-top:8px;">Cancelar</button>
    </form>
    <p id="dtf-status"></p>
  </div>
</div>

<div id="lock-overlay" class="modal" style="display:none;">
  <div class="modal-card">
    <h2>Acceso</h2>
    <input type="text" id="lock-user" placeholder="Usuario">
    <input type="password" id="lock-pass" placeholder="Contraseña">
    <div id="lock-error" style="color:#f43f5e; font-size:0.8rem;"></div>
    <button class="tool-btn primary" id="lock-btn" style="width:100%;">Ingresar</button>
    <button class="tool-btn" id="open-dtf-btn" style="width:100%; margin-top:8px;">📤 Enviar DTF</button>
    <button class="tool-btn" id="open-oc-btn" style="width:100%; margin-top:8px;">🧾 OC Termofijadoras</button>
  </div>
</div>

<!-- Cargar scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script src="auto_pack_pro.js"></script>
<script src="termofijadoras_oc.js"></script>
<script src="gallery.js"></script>
<script src="profile.js"></script>
<script src="mesasave.js"></script>

<input type="file" id="file-input" accept="image/*" style="display:none" multiple>

<script>
  (function() {
    function waitForEditor() {
      if (typeof designs !== 'undefined' && typeof canvas !== 'undefined') {
        initMobileUI();
      } else {
        setTimeout(waitForEditor, 200);
      }
    }

    function initMobileUI() {
      console.log('Modo PhotoRoom activado');

      // Ajustar canvas responsive
      const wrapper = document.getElementById('canvas-wrapper-mobile');
      const container = document.querySelector('.canvas-container');
      function resizeCanvas() {
        if (!wrapper || !canvas) return;
        const maxW = container.clientWidth - 20;
        const maxH = container.clientHeight - 20;
        const scale = Math.min(maxW / canvas.width, maxH / canvas.height);
        wrapper.style.transform = `scale(${scale})`;
        wrapper.style.transformOrigin = 'top left';
        container.scrollLeft = (canvas.width * scale - container.clientWidth) / 2;
        container.scrollTop = (canvas.height * scale - container.clientHeight) / 2;
      }
      window.addEventListener('resize', resizeCanvas);
      setTimeout(resizeCanvas, 100);

      // Conectar botones
      document.getElementById('mobile-upload')?.addEventListener('click', () => {
        const fileInput = document.getElementById('file-input');
        if (fileInput) fileInput.click();
      });
      document.getElementById('mobile-gallery')?.addEventListener('click', () => {
        const btn = document.getElementById('open-imgbb-gallery');
        if (btn) btn.click();
      });
      document.getElementById('mobile-save')?.addEventListener('click', () => {
        if (typeof saveWorkbench === 'function') saveWorkbench(false);
        else showMessage('Guardado no disponible', 'error');
      });
      document.getElementById('mobile-export')?.addEventListener('click', () => {
        if (typeof exportToFile === 'function') exportToFile();
        else showMessage('Exportación no disponible', 'error');
      });
      document.getElementById('mobile-crop')?.addEventListener('click', () => {
        if (typeof autoCropCanvasToContent === 'function') autoCropCanvasToContent(0.5);
        else showMessage('Recorte no disponible', 'error');
      });
      document.getElementById('mobile-clear')?.addEventListener('click', () => {
        const btn = document.getElementById('clear-btn');
        if (btn) btn.click();
      });
      document.getElementById('mobile-mirror')?.addEventListener('click', () => {
        const btn = document.getElementById('mirror-btn');
        if (btn) btn.click();
      });
      document.getElementById('mobile-text')?.addEventListener('click', () => {
        const btn = document.getElementById('add-text-btn');
        if (btn) btn.click();
      });
      document.getElementById('zoom-in')?.addEventListener('click', () => {
        const slider = document.getElementById('zoom-slider');
        if (slider) {
          let val = Math.min(200, parseInt(slider.value) + 10);
          slider.value = val;
          slider.dispatchEvent(new Event('input'));
        }
      });
      document.getElementById('zoom-out')?.addEventListener('click', () => {
        const slider = document.getElementById('zoom-slider');
        if (slider) {
          let val = Math.max(20, parseInt(slider.value) - 10);
          slider.value = val;
          slider.dispatchEvent(new Event('input'));
        }
      });
      document.getElementById('profile-mobile')?.addEventListener('click', () => {
        const btn = document.getElementById('open-profile-btn');
        if (btn) btn.click();
      });

      // Sincronizar estado
      function updateStatus() {
        const countSpan = document.getElementById('mobile-design-count');
        if (countSpan && typeof designs !== 'undefined') countSpan.textContent = designs.length;
        const zoomSpan = document.getElementById('mobile-zoom');
        if (zoomSpan && typeof canvasZoom !== 'undefined') zoomSpan.textContent = Math.round(canvasZoom * 100);
        const sizeSpan = document.getElementById('mobile-canvas-size');
        if (sizeSpan && typeof CANVAS_WIDTH_CM !== 'undefined' && typeof CANVAS_HEIGHT_CM !== 'undefined')
          sizeSpan.textContent = `${CANVAS_WIDTH_CM}x${CANVAS_HEIGHT_CM} cm`;
      }
      setInterval(updateStatus, 500);
    }

    waitForEditor();
  })();
</script>
</body>
</html>
