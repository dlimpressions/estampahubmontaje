<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Diseñadores - Crowdsourcing | EstampaHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #02040a; font-family: 'Segoe UI', 'Exo 2', sans-serif; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: rgba(10,14,30,0.9); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(0,212,255,0.2); backdrop-filter: blur(10px); }
        .btn { background: linear-gradient(135deg, #00d4ff, #7b2fff); border: none; padding: 8px 16px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.2s; margin: 5px; }
        .btn-small { padding: 4px 10px; font-size: 0.8rem; }
        .btn-outline { background: transparent; border: 1px solid #00d4ff; color: #00d4ff; }
        .login-box { max-width: 400px; margin: 100px auto; text-align: center; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; color: white; }
        label { color: #a0b0cc; display: block; margin-bottom: 4px; font-weight: 500; }
        .error { color: #ff6666; margin-top: 10px; }
        .loading { text-align: center; padding: 20px; color: #a0b0cc; }
        h1, h2, h3 { background: linear-gradient(135deg, #00d4ff, #7b2fff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 15px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 1px solid rgba(0,212,255,0.2); padding-bottom: 10px; }
        .tab { background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 40px; cursor: pointer; transition: 0.2s; }
        .tab.active { background: linear-gradient(135deg, #00d4ff, #7b2fff); color: white; }
        .proyecto { background: rgba(0,212,255,0.08); margin: 15px 0; padding: 15px; border-radius: 16px; border-left: 4px solid #00d4ff; }
        .propuesta-item { background: rgba(123,47,255,0.1); margin: 10px 0; padding: 15px; border-radius: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; margin-left: 8px; }
        .badge-ganador { background: #00ff9f; color: #000; }
        .badge-pendiente { background: #f43f5e; }
        .badge-pagado { background: #10b981; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: #0f1220; border-radius: 24px; padding: 25px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(0,212,255,0.3); }
        .imagen-ref { max-width: 100%; border-radius: 12px; margin: 10px 0; }
        .comision { background: rgba(0,212,255,0.1); padding: 8px; border-radius: 12px; margin: 10px 0; text-align: center; }
    </style>
</head>
<body>
<div id="login" class="login-box">
    <div class="card">
        <h2>Acceso para diseñadores</h2>
        <input type="text" id="login-user" placeholder="Usuario">
        <input type="password" id="login-pass" placeholder="Contraseña">
        <button class="btn" id="btn-login">Ingresar</button>
        <div id="login-error" class="error"></div>
    </div>
</div>

<div id="app" style="display:none;">
    <div class="container">
        <h1>🎨 Área de Diseñadores</h1>
        <div class="tabs">
            <div class="tab active" data-tab="abiertos">📋 Proyectos abiertos</div>
            <div class="tab" data-tab="misofertas">✏️ Mis ofertas</div>
            <div class="tab" data-tab="pagos">💰 Pagos recibidos</div>
        </div>

        <div id="tab-abiertos" class="card">
            <h3>Proyectos disponibles</h3>
            <div id="lista-proyectos" class="loading">Cargando...</div>
        </div>
        <div id="tab-misofertas" class="card" style="display:none;">
            <h3>Mis ofertas enviadas</h3>
            <div id="lista-misofertas" class="loading">Cargando...</div>
        </div>
        <div id="tab-pagos" class="card" style="display:none;">
            <h3>Pagos recibidos</h3>
            <div id="lista-pagos" class="loading">Cargando...</div>
        </div>
    </div>
</div>

<!-- Modal para enviar propuesta -->
<div id="modal-propuesta" class="modal" style="display:none;">
    <div class="modal-card">
        <h3 id="modal-titulo"></h3>
        <div id="modal-descripcion"></div>
        <div id="modal-imagen-ref"></div>
        <p><strong>Presupuesto original:</strong> $<span id="modal-precio"></span> COP</p>
        <label>¿Quieres hacer una contraoferta? (opcional)</label>
        <input type="number" id="contraoferta" placeholder="Dejar vacío para aceptar presupuesto original">
        <div class="comision">
            🤝 Comisión EstampaHub: 15%<br>
            <strong>Tu ganancia neta estimada:</strong> <span id="ganancia-neta">0</span> COP
        </div>
        <label>Tu imagen de diseño (URL de ImgBB)</label>
        <input type="url" id="imagen-propuesta" placeholder="https://i.ibb.co/..." required>
        <label>Comentario adicional (opcional)</label>
        <textarea id="comentario-propuesta" rows="3"></textarea>
        <button class="btn" id="btn-enviar-propuesta">Enviar propuesta</button>
        <button class="btn btn-outline" id="btn-cerrar-modal">Cancelar</button>
        <div id="modal-error" class="error"></div>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/TU_ID/exec'; // <--- REEMPLAZA CON TU URL
let usuarioActual = '';
let currentProjectForProposal = null;
let misPropuestasIds = new Set(); // para saber si ya ofertó

async function apiCall(action, data = {}) {
    let url = `${SCRIPT_URL}?action=${encodeURIComponent(action)}`;
    for (const key in data) url += `&${encodeURIComponent(key)}=${encodeURIComponent(data[key])}`;
    const res = await fetch(url);
    return await res.json();
}

// ==================== LOGIN ====================
document.getElementById('btn-login').onclick = async () => {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    if (!user || !pass) { document.getElementById('login-error').innerText = 'Complete credenciales'; return; }
    const result = await apiCall('loginDisenador', { usuario: user, contrasena: pass });
    if (result.success) {
        usuarioActual = result.usuario;
        const email = prompt('Por favor, ingresa tu correo electrónico (se usará para identificar tus propuestas):');
        if (!email) { alert('Correo requerido'); return; }
        localStorage.setItem('disenador_email', email);
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        // Cargar IDs de propuestas ya enviadas
        await cargarMisPropuestasIds(email);
        cargarProyectosAbiertos();
        cargarMisOfertas();
        cargarPagos();
    } else {
        document.getElementById('login-error').innerText = result.error;
    }
};

async function cargarMisPropuestasIds(email) {
    const res = await apiCall('listarMisPropuestasDisenador', { email });
    if (res.success) {
        misPropuestasIds.clear();
        for (const p of res.propuestas) {
            misPropuestasIds.add(p.proyecto_id);
        }
    }
}

// ==================== PROYECTOS ABIERTOS ====================
async function cargarProyectosAbiertos() {
    const div = document.getElementById('lista-proyectos');
    div.innerHTML = '<div class="loading">Cargando proyectos...</div>';
    const res = await apiCall('listarProyectosAbiertos');
    if (!res.success || !res.proyectos.length) { div.innerHTML = '<p>No hay proyectos abiertos.</p>'; return; }
    div.innerHTML = '';
    for (const proy of res.proyectos) {
        const yaOferto = misPropuestasIds.has(proy.id);
        const card = document.createElement('div');
        card.className = 'proyecto';
        card.innerHTML = `
            <h3>${escapeHtml(proy.titulo)}</h3>
            <p>${escapeHtml(proy.descripcion)}</p>
            <p><strong>💰 Presupuesto base:</strong> $${Number(proy.precio).toLocaleString('es-CO')}</p>
            <p><strong>📅 Publicado:</strong> ${new Date(proy.fecha).toLocaleDateString()}</p>
            ${proy.imagen_referencia ? `<p><strong>📷 Referencia:</strong><br><img src="${proy.imagen_referencia}" style="max-width:150px; border-radius:8px;"></p>` : ''}
            ${yaOferto ? '<button disabled style="opacity:0.5;">✅ Ya ofertaste</button>' : `<button class="btn" data-id="${proy.id}">✏️ Enviar propuesta</button>`}
        `;
        div.appendChild(card);
        if (!yaOferto) {
            card.querySelector('button').onclick = () => abrirModalPropuesta(proy);
        }
    }
}

async function abrirModalPropuesta(proyecto) {
    currentProjectForProposal = proyecto;
    document.getElementById('modal-titulo').innerText = proyecto.titulo;
    document.getElementById('modal-descripcion').innerHTML = `<p>${escapeHtml(proyecto.descripcion)}</p>`;
    document.getElementById('modal-precio').innerText = Number(proyecto.precio).toLocaleString('es-CO');
    const imgRef = proyecto.imagen_referencia;
    document.getElementById('modal-imagen-ref').innerHTML = imgRef ? `<img src="${imgRef}" class="imagen-ref">` : '<p>Sin imagen de referencia</p>';
    document.getElementById('contraoferta').value = '';
    document.getElementById('imagen-propuesta').value = '';
    document.getElementById('comentario-propuesta').value = '';
    document.getElementById('modal-error').innerText = '';
    actualizarGananciaNeta(proyecto.precio);
    document.getElementById('modal-propuesta').style.display = 'flex';
}

function actualizarGananciaNeta(precioBase) {
    const contra = parseFloat(document.getElementById('contraoferta').value);
    const monto = isNaN(contra) || contra === 0 ? precioBase : contra;
    const neto = monto * 0.85;
    document.getElementById('ganancia-neta').innerText = neto.toLocaleString('es-CO');
}

document.getElementById('contraoferta').addEventListener('input', () => {
    const precioBase = currentProjectForProposal ? currentProjectForProposal.precio : 0;
    actualizarGananciaNeta(precioBase);
});

document.getElementById('btn-enviar-propuesta').onclick = async () => {
    if (!currentProjectForProposal) return;
    const email = localStorage.getItem('disenador_email');
    if (!email) { alert('Correo no encontrado'); return; }
    const nombre = usuarioActual;
    const urlImagen = document.getElementById('imagen-propuesta').value.trim();
    if (!urlImagen) { document.getElementById('modal-error').innerText = 'La URL de la imagen es obligatoria'; return; }
    const contraoferta = parseFloat(document.getElementById('contraoferta').value);
    const comentario = document.getElementById('comentario-propuesta').value.trim();
    const result = await apiCall('agregarPropuesta', {
        proyecto_id: currentProjectForProposal.id,
        disenador: nombre,
        email: email,
        imagen_url: urlImagen,
        comentario: comentario,
        contraoferta: isNaN(contraoferta) ? '' : contraoferta
    });
    if (result.success) {
        alert('✅ Propuesta enviada correctamente');
        document.getElementById('modal-propuesta').style.display = 'none';
        // Actualizar la lista de proyectos abiertos (deshabilitar botón)
        misPropuestasIds.add(currentProjectForProposal.id);
        cargarProyectosAbiertos();
        cargarMisOfertas();
    } else {
        document.getElementById('modal-error').innerText = result.error || 'Error al enviar';
    }
};

document.getElementById('btn-cerrar-modal').onclick = () => {
    document.getElementById('modal-propuesta').style.display = 'none';
};

// ==================== MIS OFERTAS ====================
async function cargarMisOfertas() {
    const email = localStorage.getItem('disenador_email');
    if (!email) return;
    const div = document.getElementById('lista-misofertas');
    div.innerHTML = '<div class="loading">Cargando...</div>';
    const res = await apiCall('listarMisPropuestasDisenador', { email });
    if (!res.success || !res.propuestas.length) { div.innerHTML = '<p>No has enviado propuestas aún.</p>'; return; }
    div.innerHTML = '';
    for (const oferta of res.propuestas) {
        const estado = oferta.seleccionada ? '🏆 Ganadora' : '📌 Pendiente';
        const pagadoBadge = oferta.pagado ? '<span class="badge badge-pagado">💰 Pagado</span>' : '';
        const precioMostrar = oferta.precio_contraoferta ? `Contraoferta: $${Number(oferta.precio_contraoferta).toLocaleString('es-CO')}` : `Presupuesto base: $${Number(oferta.precio_base || 0).toLocaleString('es-CO')}`;
        const neto = oferta.precio_contraoferta ? oferta.precio_contraoferta * 0.85 : (oferta.precio_base || 0) * 0.85;
        const card = document.createElement('div');
        card.className = 'propuesta-item';
        card.innerHTML = `
            <div style="flex:2">
                <strong>${escapeHtml(oferta.proyecto_titulo)}</strong><br>
                <small>Enviado: ${new Date(oferta.fecha).toLocaleString()}</small><br>
                <span>${precioMostrar}</span><br>
                <span>Tu ganancia neta (85%): $${Math.floor(neto).toLocaleString('es-CO')}</span><br>
                <span class="badge ${oferta.seleccionada ? 'badge-ganador' : 'badge-pendiente'}">${estado}</span> ${pagadoBadge}
                ${oferta.enlace_entrega && oferta.seleccionada ? `<br><a href="${oferta.enlace_entrega}" target="_blank">🔗 Descargar diseño final</a>` : ''}
            </div>
        `;
        div.appendChild(card);
    }
}

// ==================== PAGOS RECIBIDOS ====================
async function cargarPagos() {
    const email = localStorage.getItem('disenador_email');
    if (!email) return;
    const div = document.getElementById('lista-pagos');
    div.innerHTML = '<div class="loading">Cargando...</div>';
    const res = await apiCall('listarMisPropuestasDisenador', { email });
    if (!res.success) { div.innerHTML = '<p>Error al cargar pagos.</p>'; return; }
    const pagos = res.propuestas.filter(p => p.pagado === true && p.seleccionada === true);
    if (!pagos.length) { div.innerHTML = '<p>Aún no has recibido pagos.</p>'; return; }
    div.innerHTML = '';
    for (const pago of pagos) {
        const montoOriginal = pago.precio_contraoferta || pago.precio_base || 0;
        const neto = montoOriginal * 0.85;
        const card = document.createElement('div');
        card.className = 'propuesta-item';
        card.innerHTML = `
            <div>
                <strong>${escapeHtml(pago.proyecto_titulo)}</strong><br>
                <span>💰 Monto pagado: $${Math.floor(neto).toLocaleString('es-CO')}</span><br>
                <span>📅 Fecha de pago: ${pago.fecha_pago ? new Date(pago.fecha_pago).toLocaleString() : 'Pendiente de registrar'}</span><br>
                ${pago.enlace_entrega ? `<a href="${pago.enlace_entrega}" target="_blank">🔗 Enlace de entrega</a>` : ''}
            </div>
        `;
        div.appendChild(card);
    }
}

// ==================== PESTAÑAS ====================
document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
        const target = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('[id^="tab-"]').forEach(panel => panel.style.display = 'none');
        document.getElementById(`tab-${target}`).style.display = 'block';
        if (target === 'abiertos') cargarProyectosAbiertos();
        if (target === 'misofertas') cargarMisOfertas();
        if (target === 'pagos') cargarPagos();
    };
});

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
}
</script>
</body>
</html>
