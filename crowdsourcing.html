<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis proyectos - Crowdsourcing | EstampaHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #02040a; font-family: 'Segoe UI', 'Exo 2', sans-serif; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: rgba(10,14,30,0.9); border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(0,212,255,0.2); }
        h1 { background: linear-gradient(135deg, #00d4ff, #7b2fff); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; margin-bottom: 20px; }
        .btn { background: linear-gradient(135deg, #00d4ff, #7b2fff); border: none; padding: 10px 20px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-small { padding: 5px 12px; font-size: 0.8rem; }
        .btn-secundario { background: #4a5568; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; color: white; }
        label { color: #a0b0cc; display: block; margin-bottom: 4px; }
        .error-msg { color: #ff6666; margin-top: 10px; }
        .success-msg { color: #88ff88; margin-top: 10px; }
        .proyecto { background: rgba(0,212,255,0.08); margin: 15px 0; padding: 15px; border-radius: 16px; border-left: 4px solid #00d4ff; }
        .propuesta { background: rgba(123,47,255,0.1); margin: 10px 0; padding: 12px; border-radius: 12px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .propuesta img { max-width: 100px; border-radius: 10px; }
        .ganador { border: 2px solid #00ff9f; background: rgba(0,255,159,0.1); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; margin-left: 8px; }
        .badge-abierto { background: #10b981; }
        .badge-cerrado { background: #6b7280; }
        .badge-pagado { background: #059669; }
        .loading { text-align: center; padding: 20px; color: #a0b0cc; }
        .imagen-ref { max-width: 150px; border-radius: 10px; margin-top: 10px; }
        .contraoferta { background: rgba(255,170,0,0.2); border-left: 4px solid #ffaa00; padding: 8px; margin-top: 5px; border-radius: 8px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Mis Proyectos de Diseño</h1>
    <div id="identificacion" class="card">
        <label>Correo electrónico</label>
        <input type="email" id="email-cliente" placeholder="tu@email.com">
        <button class="btn" id="btn-identificar">Ver mis proyectos</button>
        <div id="ident-error" class="error-msg" style="display:none;"></div>
    </div>
    <div id="panel-mis-proyectos" style="display:none;">
        <div class="card">
            <div class="flex-between" style="margin-bottom:15px;">
                <h3>Tus proyectos</h3>
                <div>
                    <button class="btn btn-small" id="btn-refrescar-proyectos">⟳ Refrescar</button>
                    <button class="btn btn-small" id="btn-nuevo-proyecto">➕ Nuevo proyecto</button>
                </div>
            </div>
            <div id="lista-proyectos" class="loading">Cargando...</div>
        </div>
    </div>
    <div id="nuevo-proyecto-modal" class="card" style="display:none;">
        <h3>Nuevo proyecto</h3>
        <input type="text" id="titulo" placeholder="Título">
        <textarea id="descripcion" rows="3" placeholder="Descripción"></textarea>
        <input type="number" id="precio" placeholder="Presupuesto (COP)" step="1000">
        <label>Imagen de referencia (opcional)</label>
        <input type="file" id="imagen-ref-input" accept="image/*">
        <div id="preview-ref" style="margin:10px 0;"></div>
        <button class="btn" id="btn-subir-imagen-ref">Subir imagen</button>
        <p style="font-size:0.8rem; color:#a0b0cc;">O pega un enlace de referencia:</p>
        <input type="url" id="enlace-ref" placeholder="https://...">
        <button class="btn" id="btn-crear-proyecto">Publicar proyecto</button>
        <button class="btn btn-secundario" id="btn-cancelar-modal">Cancelar</button>
        <div id="msg-crear-error" class="error-msg" style="display:none;"></div>
        <div id="msg-crear-success" class="success-msg" style="display:none;"></div>
    </div>
</div>
<script>
// ==================== CONFIGURACIÓN ====================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7tPsabkyiBcVdoLOHzVadzuF2KLnodP7plV0Rl2Oa8GBDK-ZXR96AEzzqSRDiA8YvKw/exec'; // <--- REEMPLAZA CON TU URL
const IMGBB_API_KEY = '4462519cb074f1cbc262c103c3f2dc3c'; // <--- REEMPLAZA CON TU CLAVE

let currentEmail = '';
let imagenReferenciaUrl = '';

// ==================== FUNCIONES ====================
async function apiCall(action, data = {}) {
    let url = `${SCRIPT_URL}?action=${encodeURIComponent(action)}`;
    for (const key in data) url += `&${encodeURIComponent(key)}=${encodeURIComponent(data[key])}`;
    const res = await fetch(url);
    return await res.json();
}

async function subirImagenABase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function subirImgBB(file) {
    const base64 = await subirImagenABase64(file);
    const formData = new FormData();
    formData.append('key', IMGBB_API_KEY);
    formData.append('image', base64);
    const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
    const data = await response.json();
    if (data.success) return data.data.url;
    else throw new Error(data.error.message);
}

// ==================== MANEJO DE INTERFAZ ====================
document.getElementById('btn-identificar').onclick = async () => {
    const email = document.getElementById('email-cliente').value.trim();
    if (!email || !email.includes('@')) { document.getElementById('ident-error').innerText = 'Correo inválido'; return; }
    currentEmail = email;
    document.getElementById('identificacion').style.display = 'none';
    document.getElementById('panel-mis-proyectos').style.display = 'block';
    await cargarMisProyectos();
};

async function cargarMisProyectos() {
    const div = document.getElementById('lista-proyectos');
    div.innerHTML = '<div class="loading">Cargando tus proyectos...</div>';
    const res = await apiCall('listarMisProyectos', { correo: currentEmail });
    if (!res.success || !res.proyectos.length) { div.innerHTML = '<p>No tienes proyectos aún. Crea uno nuevo.</p>'; return; }
    div.innerHTML = '';
    for (const proy of res.proyectos) {
        const estadoBadge = proy.estado === 'abierto' ? '<span class="badge badge-abierto">🟢 Abierto</span>' : '<span class="badge badge-cerrado">🔒 Cerrado</span>';
        const pagadoBadge = proy.pagado ? '<span class="badge badge-pagado">✅ Pagado</span>' : '<span class="badge" style="background:#f43f5e;">⏳ Pendiente</span>';
        const card = document.createElement('div');
        card.className = 'proyecto';
        card.innerHTML = `
            <h3>${escapeHtml(proy.titulo)}</h3>
            <p>${escapeHtml(proy.descripcion)}</p>
            <p><strong>Presupuesto:</strong> $${Number(proy.precio).toLocaleString('es-CO')} 
            ${proy.estado === 'abierto' ? `<button class="btn btn-small" data-editar="${proy.id}" data-precio="${proy.precio}">✏️ Editar</button>` : ''}</p>
            <p><strong>Fecha:</strong> ${new Date(proy.fecha).toLocaleDateString()}</p>
            <p><strong>Estado:</strong> ${estadoBadge} ${pagadoBadge}</p>
            ${proy.enlace_entrega ? `<p><strong>🔗 Entrega:</strong> <a href="${proy.enlace_entrega}" target="_blank">Descargar diseño final</a></p>` : ''}
            ${proy.imagen_referencia ? `<p><strong>📷 Imagen de referencia:</strong><br><img src="${proy.imagen_referencia}" class="imagen-ref"></p>` : ''}
            <button class="btn" data-ver="${proy.id}">👁️ Ver propuestas recibidas</button>
        `;
        div.appendChild(card);
        card.querySelector(`[data-ver="${proy.id}"]`).onclick = () => verPropuestas(proy.id, proy.estado === 'abierto', proy.pagado);
        const btnEditar = card.querySelector(`[data-editar="${proy.id}"]`);
        if (btnEditar) btnEditar.onclick = () => editarPresupuesto(proy.id, proy.precio);
    }
}

async function editarPresupuesto(proyecto_id, precioActual) {
    const nuevoPrecio = prompt('Nuevo presupuesto (COP):', precioActual);
    if (!nuevoPrecio) return;
    const num = parseFloat(nuevoPrecio);
    if (isNaN(num) || num <= 0) { alert('Monto inválido'); return; }
    const result = await apiCall('actualizarPresupuesto', { proyecto_id, nuevo_precio: num });
    if (result.success) {
        alert('✅ Presupuesto actualizado');
        await cargarMisProyectos();
    } else {
        alert('❌ Error: ' + (result.error || 'Desconocido'));
    }
}

async function verPropuestas(proyecto_id, abierto, pagado) {
    const res = await apiCall('listarPropuestas', { proyecto_id });
    if (!res.success || !res.propuestas.length) { alert('No hay propuestas aún.'); return; }
    let html = `<h3>Propuestas recibidas</h3>`;
    for (let p of res.propuestas) {
        let imagenHtml = '';
        if (pagado && p.seleccionada && p.imagen_diseno) {
            imagenHtml = `<img src="${p.imagen_diseno}" onerror="this.src='https://via.placeholder.com/100'" style="max-width:100px; border-radius:8px;">`;
        } else if (!pagado && p.seleccionada) {
            imagenHtml = '<div style="background:#333; padding:5px; border-radius:8px;">🔒 Diseño disponible solo después del pago</div>';
        }
        let fechaEntregaHtml = '';
        if (p.fecha_entrega) {
            fechaEntregaHtml = `<br><span>📅 Entrega estimada: ${new Date(p.fecha_entrega).toLocaleString()}</span>`;
        }
        let contraOfertaHtml = '';
        if (abierto && p.precio_contraoferta && p.estado_contraoferta === 'pendiente') {
            contraOfertaHtml = `
                <div class="contraoferta">
                    💰 Contraoferta: $${Number(p.precio_contraoferta).toLocaleString('es-CO')}
                    <button class="btn btn-small" data-aceptar-contra="${p.id}" data-proy="${proyecto_id}">✅ Aceptar contraoferta</button>
                </div>
            `;
        }
        html += `<div class="propuesta ${p.seleccionada ? 'ganador' : ''}">
            ${imagenHtml}
            <div>
                <strong>${escapeHtml(p.disenador)}</strong> (${escapeHtml(p.email)})<br>
                <em>${escapeHtml(p.comentario) || 'Sin comentarios'}</em><br>
                <small>Enviado: ${new Date(p.fecha).toLocaleString()}</small>${fechaEntregaHtml}
                ${abierto && !p.seleccionada ? `<br><button class="btn btn-small" data-elegir="${p.id}" data-proy="${proyecto_id}">🏆 Elegir como ganadora</button>` : ''}
                ${p.seleccionada ? '<br><span style="color:#00ff9f;">✨ PROPUESTA GANADORA ✨</span>' : ''}
                ${contraOfertaHtml}
            </div>
        </div>`;
    }
    const modal = window.open('', '_blank', 'width=700,height=600');
    modal.document.write(`
        <html><head><title>Propuestas</title>
        <style>
            body{background:#02040a;color:white;font-family:sans-serif;padding:20px;}
            .propuesta{background:rgba(123,47,255,0.1);margin:10px 0;padding:12px;border-radius:12px;display:flex;gap:15px;flex-wrap:wrap;}
            .propuesta img{max-width:100px;border-radius:10px;}
            .ganador{border:2px solid #00ff9f;}
            .contraoferta{background:rgba(255,170,0,0.2);border-left:4px solid #ffaa00;padding:8px;margin-top:5px;border-radius:8px;}
            .btn{background:linear-gradient(135deg,#00d4ff,#7b2fff);border:none;padding:5px 10px;border-radius:20px;color:white;cursor:pointer;}
        </style>
        </head>
        <body>${html}
        <script>
            const SCRIPT_URL = '${SCRIPT_URL}';
            async function elegirGanador(propId, proyId) {
                const url = \`\${SCRIPT_URL}?action=elegirGanadorCliente&proyecto_id=\${proyId}&propuesta_id=\${propId}\`;
                const res = await fetch(url);
                const data = await res.json();
                if(data.success) {
                    alert('✅ Ganador seleccionado. El proyecto se ha cerrado.');
                    location.reload();
                } else {
                    alert('❌ Error: ' + (data.error || 'desconocido'));
                }
            }
            async function aceptarContra(propId, proyId) {
                const url = \`\${SCRIPT_URL}?action=aceptarContraOferta&propuesta_id=\${propId}&proyecto_id=\${proyId}\`;
                const res = await fetch(url);
                const data = await res.json();
                if(data.success) {
                    alert(\`✅ Contraoferta aceptada. Nuevo presupuesto: $\${Number(data.nuevo_precio).toLocaleString('es-CO')}\`);
                    location.reload();
                } else {
                    alert('❌ Error: ' + (data.error || 'desconocido'));
                }
            }
            document.querySelectorAll('[data-elegir]').forEach(btn => {
                btn.onclick = () => elegirGanador(btn.dataset.elegir, btn.dataset.proy);
            });
            document.querySelectorAll('[data-aceptar-contra]').forEach(btn => {
                btn.onclick = () => aceptarContra(btn.dataset.aceptarContra, btn.dataset.proy);
            });
        <\/script>
        </body>
        </html>
    `);
    modal.document.close();
}

// ==================== REFRESCAR PROYECTOS ====================
document.getElementById('btn-refrescar-proyectos').onclick = () => {
    if (currentEmail) cargarMisProyectos();
    else alert('Primero identifícate con tu correo.');
};

// ==================== CREAR PROYECTO CON IMAGEN ====================
document.getElementById('btn-subir-imagen-ref').onclick = async () => {
    const fileInput = document.getElementById('imagen-ref-input');
    if (!fileInput.files.length) { alert('Selecciona una imagen primero'); return; }
    const file = fileInput.files[0];
    try {
        const url = await subirImgBB(file);
        imagenReferenciaUrl = url;
        document.getElementById('preview-ref').innerHTML = `<img src="${url}" width="100" style="border-radius:8px;">`;
        alert('Imagen subida correctamente');
    } catch(e) {
        alert('Error al subir imagen: ' + e.message);
    }
};

document.getElementById('btn-crear-proyecto').onclick = async () => {
    const titulo = document.getElementById('titulo').value.trim();
    const descripcion = document.getElementById('descripcion').value.trim();
    const precio = parseFloat(document.getElementById('precio').value);
    const enlaceRef = document.getElementById('enlace-ref').value.trim();
    const imagenRef = imagenReferenciaUrl || enlaceRef;
    if (!titulo || !descripcion || !precio) {
        document.getElementById('msg-crear-error').innerText = 'Completa todos los campos obligatorios';
        return;
    }
    const result = await apiCall('crearProyecto', {
        titulo, descripcion, precio,
        correo_cliente: currentEmail,
        imagen_referencia: imagenRef
    });
    if (result.success) {
        document.getElementById('msg-crear-success').innerText = '✅ Proyecto creado';
        setTimeout(() => {
            document.getElementById('nuevo-proyecto-modal').style.display = 'none';
            document.getElementById('panel-mis-proyectos').style.display = 'block';
            cargarMisProyectos();
            limpiarFormularioNuevo();
        }, 1500);
    } else {
        document.getElementById('msg-crear-error').innerText = 'Error: ' + (result.error || 'Desconocido');
    }
};

function limpiarFormularioNuevo() {
    document.getElementById('titulo').value = '';
    document.getElementById('descripcion').value = '';
    document.getElementById('precio').value = '';
    document.getElementById('imagen-ref-input').value = '';
    document.getElementById('enlace-ref').value = '';
    document.getElementById('preview-ref').innerHTML = '';
    imagenReferenciaUrl = '';
}

document.getElementById('btn-nuevo-proyecto').onclick = () => {
    document.getElementById('nuevo-proyecto-modal').style.display = 'block';
    document.getElementById('panel-mis-proyectos').style.display = 'none';
};
document.getElementById('btn-cancelar-modal').onclick = () => {
    document.getElementById('nuevo-proyecto-modal').style.display = 'none';
    document.getElementById('panel-mis-proyectos').style.display = 'block';
};

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
}
</script>
</body>
</html>
