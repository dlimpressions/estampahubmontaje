<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Crowdsourcing de Diseños · EstampaHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #02040a;
            font-family: 'Segoe UI', 'Exo 2', sans-serif;
            color: #e2e8f0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            background: linear-gradient(135deg, #00d4ff, #7b2fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(10,14,30,0.9);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0,212,255,0.2);
            backdrop-filter: blur(10px);
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #7b2fff);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        .proyecto {
            background: rgba(0,212,255,0.05);
            margin: 10px 0;
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
        }
        .propuesta {
            background: rgba(123,47,255,0.1);
            margin: 10px 0;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .propuesta img {
            max-width: 150px;
            border-radius: 12px;
        }
        .ganador { border: 2px solid #00ff9f; background: rgba(0,255,159,0.1); }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
        }
        .tab.active {
            background: linear-gradient(135deg, #00d4ff, #7b2fff);
            color: white;
        }
        .error-msg {
            color: #ff6666;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        .success-msg {
            color: #88ff88;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #a0b0cc;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎨 Crowdsourcing de Diseños</h1>
    <p>Publica tu proyecto y recibe propuestas de diseñadores. Tú eliges el precio y seleccionas al ganador.</p>

    <div class="tabs">
        <div class="tab active" data-tab="crear">➕ Crear proyecto</div>
        <div class="tab" data-tab="proyectos">📋 Proyectos activos</div>
        <div class="tab" data-tab="mispropuestas">✏️ Mis propuestas</div>
    </div>

    <div id="panel-crear" class="card">
        <h3>Nuevo proyecto</h3>
        <input type="text" id="titulo" placeholder="Título (ej: Logo para marca de café)">
        <textarea id="descripcion" rows="3" placeholder="Describe lo que necesitas..."></textarea>
        <input type="number" id="precio" placeholder="Precio que ofreces (COP)" step="1000">
        <button class="btn" id="btn-crear">Publicar proyecto</button>
        <div id="msg-crear" class="error-msg" style="display:none;"></div>
        <div id="msg-crear-success" class="success-msg" style="display:none;"></div>
    </div>

    <div id="panel-proyectos" class="card" style="display:none;">
        <h3>Proyectos abiertos</h3>
        <div id="lista-proyectos" class="loading">Cargando proyectos...</div>
    </div>

    <div id="panel-mispropuestas" class="card" style="display:none;">
        <h3>Mis propuestas enviadas</h3>
        <div id="lista-mis-propuestas" class="loading">Cargando...</div>
    </div>
</div>

<script>
// === CONFIGURACIÓN ===
// Coloca AQUÍ la URL que copiaste al desplegar el Apps Script
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFxEd6__lwGetRcXtumPjagHh60vNM1b3i_PmwvqxJW0RR3gSwIrLo3MRlkT74zqeEgQ/exec';

// === Función para llamar al Apps Script sin problemas de CORS ===
async function apiCall(action, data = {}) {
    const params = new URLSearchParams();
    params.append('action', action);
    for (const key in data) {
        params.append(key, data[key]);
    }
    try {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: params,
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });
        const text = await response.text();
        try {
            return JSON.parse(text);
        } catch(e) {
            console.error('Respuesta no JSON:', text);
            return { success: false, error: 'Respuesta inválida del servidor' };
        }
    } catch (err) {
        console.error('Error de red:', err);
        return { success: false, error: err.message };
    }
}

async function getProyectos() {
    try {
        const res = await fetch(`${SCRIPT_URL}?action=listarProyectos`);
        const text = await res.text();
        try {
            const json = JSON.parse(text);
            if (json.success) return json.proyectos;
            else return [];
        } catch(e) {
            console.error('Error parseando proyectos:', text);
            return [];
        }
    } catch(e) {
        console.error('Error cargando proyectos:', e);
        return [];
    }
}

function mostrarError(id, texto) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
}

function mostrarExito(id, texto) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
}

// === Crear proyecto ===
document.getElementById('btn-crear').onclick = async () => {
    const titulo = document.getElementById('titulo').value.trim();
    const descripcion = document.getElementById('descripcion').value.trim();
    const precio = parseFloat(document.getElementById('precio').value);
    if (!titulo || !descripcion || !precio) {
        mostrarError('msg-crear', '❌ Completa todos los campos');
        return;
    }
    const result = await apiCall('crearProyecto', { titulo, descripcion, precio });
    if (result.success) {
        mostrarExito('msg-crear-success', '✅ Proyecto creado correctamente');
        document.getElementById('titulo').value = '';
        document.getElementById('descripcion').value = '';
        document.getElementById('precio').value = '';
        if (document.getElementById('panel-proyectos').style.display !== 'none') {
            cargarProyectos();
        }
    } else {
        mostrarError('msg-crear', '❌ Error al crear: ' + (result.error || 'Desconocido'));
    }
};

// === Listar proyectos ===
async function cargarProyectos() {
    const div = document.getElementById('lista-proyectos');
    div.innerHTML = '<div class="loading">Cargando proyectos...</div>';
    const proyectos = await getProyectos();
    if (!proyectos || proyectos.length === 0) {
        div.innerHTML = '<p>No hay proyectos activos aún. ¡Crea el primero!</p>';
        return;
    }
    div.innerHTML = '';
    for (const proy of proyectos) {
        if (proy.estado !== 'abierto') continue;
        const card = document.createElement('div');
        card.className = 'proyecto';
        card.innerHTML = `
            <h3>${escapeHtml(proy.titulo)}</h3>
            <p>${escapeHtml(proy.descripcion)}</p>
            <p><strong>💰 Presupuesto:</strong> $${proy.precio.toLocaleString('es-CO')}</p>
            <p><strong>📅 Publicado:</strong> ${new Date(proy.fecha).toLocaleDateString()}</p>
            <button class="btn" data-id="${proy.id}">✏️ Enviar propuesta</button>
            <button class="btn" data-ver="${proy.id}">👁️ Ver propuestas</button>
        `;
        div.appendChild(card);
        card.querySelector(`button[data-id="${proy.id}"]`).onclick = () => mostrarFormPropuesta(proy);
        card.querySelector(`button[data-ver="${proy.id}"]`).onclick = () => verPropuestas(proy.id);
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// === Enviar propuesta ===
function mostrarFormPropuesta(proyecto) {
    const nombre = prompt('Tu nombre (como diseñador):');
    if (!nombre) return;
    const email = prompt('Correo electrónico (para contactarte):');
    if (!email) return;
    const urlImagen = prompt('URL de la imagen de tu diseño (sube a ImgBB y pega el enlace):', 'https://i.imgur.com/ejemplo.jpg');
    if (!urlImagen) return;
    const comentario = prompt('Comentario o explicación de tu propuesta (opcional):');
    submitPropuesta(proyecto.id, nombre, email, urlImagen, comentario);
}

async function submitPropuesta(proyecto_id, disenador, email, imagen_url, comentario) {
    const result = await apiCall('agregarPropuesta', { proyecto_id, disenador, email, imagen_url, comentario });
    if (result.success) {
        alert('✅ Propuesta enviada correctamente');
        let misPropuestas = JSON.parse(localStorage.getItem('misPropuestas') || '[]');
        misPropuestas.push({ proyecto_id, disenador, email, imagen_url, comentario, fecha: new Date().toISOString() });
        localStorage.setItem('misPropuestas', JSON.stringify(misPropuestas));
        cargarMisPropuestas();
    } else {
        alert('❌ Error al enviar: ' + (result.error || 'Desconocido'));
    }
}

// === Ver propuestas ===
async function verPropuestas(proyecto_id) {
    try {
        const res = await fetch(`${SCRIPT_URL}?action=listarPropuestas&proyecto_id=${proyecto_id}`);
        const data = await res.json();
        if (!data.success || data.propuestas.length === 0) {
            alert('No hay propuestas para este proyecto aún.');
            return;
        }
        let html = `<h3>Propuestas para el proyecto</h3>`;
        for (let p of data.propuestas) {
            html += `
                <div class="propuesta ${p.seleccionada ? 'ganador' : ''}">
                    <img src="${p.imagen_url}" onerror="this.src='https://via.placeholder.com/150'">
                    <div>
                        <strong>${escapeHtml(p.disenador)}</strong> (${escapeHtml(p.email)})<br>
                        <em>${escapeHtml(p.comentario) || 'Sin comentarios'}</em><br>
                        <small>Enviado: ${new Date(p.fecha).toLocaleString()}</small>
                        ${!p.seleccionada ? `<br><button class="btn" data-prop="${p.id}" data-proy="${proyecto_id}">🏆 Seleccionar como ganador</button>` : '<span style="color:#00ff9f;">✨ GANADOR ✨</span>'}
                    </div>
                </div>
            `;
        }
        const modal = window.open('', '_blank', 'width=650,height=550');
        modal.document.write(`
            <html>
            <head><title>Propuestas - EstampaHub</title>
            <style>
                body{background:#02040a;color:white;font-family:sans-serif;padding:20px;}
                .propuesta{background:rgba(123,47,255,0.1);margin:10px 0;padding:12px;border-radius:12px;display:flex;gap:15px;flex-wrap:wrap;}
                .propuesta img{max-width:150px;border-radius:12px;}
                .ganador{border:2px solid #00ff9f;background:rgba(0,255,159,0.1);}
                .btn{background:linear-gradient(135deg,#00d4ff,#7b2fff);border:none;padding:6px 12px;border-radius:20px;color:white;cursor:pointer;}
            </style>
            </head>
            <body>${html}
            <script>
                const SCRIPT_URL = '${SCRIPT_URL}';
                async function seleccionar(propId, proyId) {
                    const params = new URLSearchParams();
                    params.append('action', 'seleccionarGanador');
                    params.append('proyecto_id', proyId);
                    params.append('propuesta_id', propId);
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: params,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const data = await response.json();
                    if(data.success) {
                        alert('✅ Ganador seleccionado');
                        location.reload();
                    } else {
                        alert('❌ Error: ' + (data.error || 'desconocido'));
                    }
                }
                document.querySelectorAll('[data-prop]').forEach(btn=>{
                    btn.onclick = () => seleccionar(btn.dataset.prop, btn.dataset.proy);
                });
            <\/script>
            </body>
            </html>
        `);
        modal.document.close();
    } catch(e) {
        alert('Error al cargar propuestas: ' + e.message);
    }
}

// === Mis propuestas ===
function cargarMisPropuestas() {
    const misPropuestas = JSON.parse(localStorage.getItem('misPropuestas') || '[]');
    const div = document.getElementById('lista-mis-propuestas');
    if (!misPropuestas.length) {
        div.innerHTML = '<p>No has enviado ninguna propuesta aún.</p>';
        return;
    }
    div.innerHTML = misPropuestas.map(p => `
        <div class="propuesta">
            <img src="${p.imagen_url}" width="80" style="object-fit:cover;">
            <div>
                <strong>Proyecto ID:</strong> ${p.proyecto_id}<br>
                <small>Enviado: ${new Date(p.fecha).toLocaleString()}</small><br>
                <em>${escapeHtml(p.comentario) || ''}</em>
            </div>
        </div>
    `).join('');
}

// === Pestañas ===
document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
        const target = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('[id^="panel-"]').forEach(panel => panel.style.display = 'none');
        document.getElementById(`panel-${target}`).style.display = 'block';
        if (target === 'proyectos') cargarProyectos();
        if (target === 'mispropuestas') cargarMisPropuestas();
    };
});

// Precarga de proyectos
getProyectos().then(() => console.log('Proyectos precargados'));
</script>
</body>
</html>
