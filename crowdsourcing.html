<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Crowdsourcing de Diseños · EstampaHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #02040a;
            font-family: 'Segoe UI', 'Exo 2', sans-serif;
            color: #e2e8f0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { background: linear-gradient(135deg, #00d4ff, #7b2fff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 20px; }
        .card { background: rgba(10,14,30,0.9); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(0,212,255,0.2); backdrop-filter: blur(10px); }
        .btn { background: linear-gradient(135deg, #00d4ff, #7b2fff); border: none; padding: 10px 20px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.02); }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; color: white; font-size: 1rem; }
        .proyecto { background: rgba(0,212,255,0.05); margin: 10px 0; padding: 15px; border-radius: 16px; }
        .propuesta { background: rgba(123,47,255,0.1); margin: 10px 0; padding: 12px; border-radius: 12px; display: flex; gap: 15px; flex-wrap: wrap; }
        .propuesta img { max-width: 150px; border-radius: 12px; }
        .ganador { border: 2px solid #00ff9f; background: rgba(0,255,159,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 40px; cursor: pointer; }
        .tab.active { background: linear-gradient(135deg, #00d4ff, #7b2fff); color: white; }
        .error-msg, .success-msg { margin-top: 10px; font-size: 0.85rem; }
        .error-msg { color: #ff6666; }
        .success-msg { color: #88ff88; }
        .loading { text-align: center; padding: 20px; color: #a0b0cc; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎨 Crowdsourcing de Diseños</h1>
    <p>Publica tu proyecto y recibe propuestas de diseñadores. Tú eliges el precio y seleccionas al ganador.</p>

    <div class="tabs">
        <div class="tab active" data-tab="crear">➕ Crear proyecto</div>
        <div class="tab" data-tab="proyectos">📋 Proyectos activos</div>
        <div class="tab" data-tab="mispropuestas">✏️ Mis propuestas</div>
    </div>

    <div id="panel-crear" class="card">
        <h3>Nuevo proyecto</h3>
        <input type="text" id="titulo" placeholder="Título">
        <textarea id="descripcion" rows="3" placeholder="Descripción"></textarea>
        <input type="number" id="precio" placeholder="Precio (COP)" step="1000">
        <button class="btn" id="btn-crear">Publicar proyecto</button>
        <div id="msg-crear" class="error-msg" style="display:none;"></div>
        <div id="msg-crear-success" class="success-msg" style="display:none;"></div>
    </div>

    <div id="panel-proyectos" class="card" style="display:none;">
        <h3>Proyectos abiertos</h3>
        <div id="lista-proyectos" class="loading">Cargando...</div>
    </div>

    <div id="panel-mispropuestas" class="card" style="display:none;">
        <h3>Mis propuestas</h3>
        <div id="lista-mis-propuestas" class="loading">Cargando...</div>
    </div>
</div>

<script>
// ⚠️ REEMPLAZA ESTA URL CON LA QUE COPIASSTE DE APPS SCRIPT ⚠️
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZ1WSBzyRf1ZSb5PUnOIek30CGaNOk1gz1JdfiwG6_IbAAPrGEMSoYNsPuJy-5v7scdg/exec';

// Función que usa GET para crear (evita CORS por completo)
async function apiCall(action, data = {}) {
    let url = `${SCRIPT_URL}?action=${encodeURIComponent(action)}`;
    for (const key in data) {
        url += `&${encodeURIComponent(key)}=${encodeURIComponent(data[key])}`;
    }
    try {
        const response = await fetch(url);
        const text = await response.text();
        try {
            return JSON.parse(text);
        } catch(e) {
            console.error('Respuesta no JSON:', text);
            return { success: false, error: 'Respuesta inválida' };
        }
    } catch (err) {
        console.error('Error de red:', err);
        return { success: false, error: err.message };
    }
}

async function getProyectos() {
    const res = await apiCall('listarProyectos');
    return res.success ? res.proyectos : [];
}

function mostrarError(id, texto) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
}
function mostrarExito(id, texto) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
}

document.getElementById('btn-crear').onclick = async () => {
    const titulo = document.getElementById('titulo').value.trim();
    const descripcion = document.getElementById('descripcion').value.trim();
    const precio = parseFloat(document.getElementById('precio').value);
    if (!titulo || !descripcion || !precio) {
        mostrarError('msg-crear', '❌ Completa todos los campos');
        return;
    }
    const result = await apiCall('crearProyecto', { titulo, descripcion, precio });
    if (result.success) {
        mostrarExito('msg-crear-success', '✅ Proyecto creado correctamente');
        document.getElementById('titulo').value = '';
        document.getElementById('descripcion').value = '';
        document.getElementById('precio').value = '';
        if (document.getElementById('panel-proyectos').style.display !== 'none') cargarProyectos();
    } else {
        mostrarError('msg-crear', '❌ Error: ' + (result.error || 'Desconocido'));
    }
};

async function cargarProyectos() {
    const div = document.getElementById('lista-proyectos');
    div.innerHTML = '<div class="loading">Cargando proyectos...</div>';
    const proyectos = await getProyectos();
    if (!proyectos.length) {
        div.innerHTML = '<p>No hay proyectos activos aún. ¡Crea el primero!</p>';
        return;
    }
    div.innerHTML = '';
    for (const proy of proyectos) {
        if (proy.estado !== 'abierto') continue;
        const card = document.createElement('div');
        card.className = 'proyecto';
        card.innerHTML = `
            <h3>${escapeHtml(proy.titulo)}</h3>
            <p>${escapeHtml(proy.descripcion)}</p>
            <p><strong>💰 Presupuesto:</strong> $${Number(proy.precio).toLocaleString('es-CO')}</p>
            <p><strong>📅 Publicado:</strong> ${new Date(proy.fecha).toLocaleDateString()}</p>
            <button class="btn" data-id="${proy.id}">✏️ Enviar propuesta</button>
            <button class="btn" data-ver="${proy.id}">👁️ Ver propuestas</button>
        `;
        div.appendChild(card);
        card.querySelector(`[data-id="${proy.id}"]`).onclick = () => mostrarFormPropuesta(proy);
        card.querySelector(`[data-ver="${proy.id}"]`).onclick = () => verPropuestas(proy.id);
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
    });
}

function mostrarFormPropuesta(proyecto) {
    const nombre = prompt('Tu nombre (como diseñador):');
    if (!nombre) return;
    const email = prompt('Correo electrónico:');
    if (!email) return;
    const urlImagen = prompt('URL de la imagen (sube a ImgBB y pega el enlace):');
    if (!urlImagen) return;
    const comentario = prompt('Comentario (opcional):');
    submitPropuesta(proyecto.id, nombre, email, urlImagen, comentario);
}

async function submitPropuesta(proyecto_id, disenador, email, imagen_url, comentario) {
    const result = await apiCall('agregarPropuesta', { proyecto_id, disenador, email, imagen_url, comentario });
    if (result.success) {
        alert('✅ Propuesta enviada');
        let mis = JSON.parse(localStorage.getItem('misPropuestas') || '[]');
        mis.push({ proyecto_id, disenador, email, imagen_url, comentario, fecha: new Date().toISOString() });
        localStorage.setItem('misPropuestas', JSON.stringify(mis));
        cargarMisPropuestas();
    } else {
        alert('❌ Error: ' + (result.error || 'Desconocido'));
    }
}

async function verPropuestas(proyecto_id) {
    const res = await apiCall('listarPropuestas', { proyecto_id });
    if (!res.success || res.propuestas.length === 0) {
        alert('No hay propuestas para este proyecto aún.');
        return;
    }
    let html = `<h3>Propuestas</h3>`;
    for (let p of res.propuestas) {
        html += `
            <div class="propuesta ${p.seleccionada ? 'ganador' : ''}">
                <img src="${p.imagen_url}" onerror="this.src='https://via.placeholder.com/150'">
                <div>
                    <strong>${escapeHtml(p.disenador)}</strong> (${escapeHtml(p.email)})<br>
                    <em>${escapeHtml(p.comentario) || 'Sin comentarios'}</em><br>
                    <small>${new Date(p.fecha).toLocaleString()}</small>
                    ${!p.seleccionada ? `<br><button class="btn" data-prop="${p.id}" data-proy="${proyecto_id}">🏆 Seleccionar ganador</button>` : '<span style="color:#00ff9f;">✨ GANADOR ✨</span>'}
                </div>
            </div>
        `;
    }
    const modal = window.open('', '_blank', 'width=650,height=550');
    modal.document.write(`
        <html><head><title>Propuestas</title>
        <style>
            body{background:#02040a;color:white;font-family:sans-serif;padding:20px;}
            .propuesta{background:rgba(123,47,255,0.1);margin:10px 0;padding:12px;border-radius:12px;display:flex;gap:15px;flex-wrap:wrap;}
            .propuesta img{max-width:150px;border-radius:12px;}
            .ganador{border:2px solid #00ff9f;}
            .btn{background:linear-gradient(135deg,#00d4ff,#7b2fff);border:none;padding:6px 12px;border-radius:20px;color:white;cursor:pointer;}
        </style>
        </head>
        <body>${html}
        <script>
            const SCRIPT_URL = '${SCRIPT_URL}';
            async function seleccionar(propId, proyId) {
                const url = \`\${SCRIPT_URL}?action=seleccionarGanador&proyecto_id=\${proyId}&propuesta_id=\${propId}\`;
                const response = await fetch(url);
                const data = await response.json();
                if(data.success) {
                    alert('✅ Ganador seleccionado');
                    location.reload();
                } else {
                    alert('❌ Error: ' + (data.error || 'desconocido'));
                }
            }
            document.querySelectorAll('[data-prop]').forEach(btn => {
                btn.onclick = () => seleccionar(btn.dataset.prop, btn.dataset.proy);
            });
        <\/script>
        </body>
        </html>
    `);
    modal.document.close();
}

function cargarMisPropuestas() {
    const mis = JSON.parse(localStorage.getItem('misPropuestas') || '[]');
    const div = document.getElementById('lista-mis-propuestas');
    if (!mis.length) {
        div.innerHTML = '<p>No has enviado ninguna propuesta aún.</p>';
        return;
    }
    div.innerHTML = mis.map(p => `
        <div class="propuesta">
            <img src="${p.imagen_url}" width="80">
            <div>
                <strong>Proyecto ID:</strong> ${p.proyecto_id}<br>
                <small>${new Date(p.fecha).toLocaleString()}</small><br>
                <em>${escapeHtml(p.comentario)}</em>
            </div>
        </div>
    `).join('');
}

// Pestañas
document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
        const target = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('[id^="panel-"]').forEach(p => p.style.display = 'none');
        document.getElementById(`panel-${target}`).style.display = 'block';
        if (target === 'proyectos') cargarProyectos();
        if (target === 'mispropuestas') cargarMisPropuestas();
    };
});

getProyectos(); // precarga
</script>
</body>
</html>
